[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdcautocert"
version = "0.2.0"
description = "Salesforce certificate discovery, usage mapping and relevance triage (Cert Manager)"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "certifi"]

[project.optional-dependencies]
web = ["fastapi", "uvicorn"]

[tool.setuptools]
packages = ["sfdcautocert", "sfdcautocert.sf"]

[tool.setuptools.package-data]
sfdcautocert = ["static/*.html"]
